apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexora-web
  namespace: nexora-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexora-web
  template:
    metadata:
      labels:
        app: nexora-web
    spec:
      containers:
        - name: web
          image: ghcr.io/nexora/ai-ceo-web:latest
          ports:
            - containerPort: 3001
          env:
            - name: NEXT_PUBLIC_API_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: nexora-web-secrets
                  key: NEXT_PUBLIC_API_BASE_URL
            - name: API_PROXY_TARGET
              value: http://nexora-api:3000
