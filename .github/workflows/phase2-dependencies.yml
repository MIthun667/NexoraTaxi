name: phase2-dependency-update

on:
  push:
    branches:
      - feat/p1-durable-jobs-worker

permissions:
  contents: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p1-durable-jobs-worker
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm add @nestjs/bullmq bullmq ioredis
      - name: Commit generated dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build(deps): install BullMQ and Redis dependencies"
          git push origin HEAD:feat/p1-durable-jobs-worker
