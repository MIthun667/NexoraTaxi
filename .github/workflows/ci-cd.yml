name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexora_test
          POSTGRES_PASSWORD: nexora_test_password
          POSTGRES_DB: nexora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora_test -d nexora_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://nexora_test:nexora_test_password@127.0.0.1:5432/nexora_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-that-is-at-least-thirty-two-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-different-and-long-enough
      ENCRYPTION_KEY: ci-encryption-key-that-is-at-least-thirty-two-characters
      SHOPIFY_API_KEY: ci-shopify-api-key
      SHOPIFY_API_SECRET: ci-shopify-api-secret
      SHOPIFY_SCOPES: read_orders,read_products,read_customers
      SHOPIFY_REDIRECT_URI: http://127.0.0.1:3001/api/v1/integrations/shopify/callback
      SHOPIFY_APP_URL: http://127.0.0.1:3001
      SHOPIFY_WEBHOOK_BASE_URL: http://127.0.0.1:3001
      OLLAMA_HEALTHCHECK_ENABLED: "false"
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      API_PROXY_TARGET: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck:seed
      - run: pnpm web:build
      - run: pnpm test:ci
      - name: Verify clean migration history
        run: pnpm prisma migrate deploy

  docker-images:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ai-ceo-api:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.worker
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ai-ceo-worker:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ai-ceo-web:${{ github.sha }}
